<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQ7 Image Browser</title>
<link rel="stylesheet" href="style.css">
<style>
  #imgLayout { display: flex; flex: 1; min-height: 0; }
  #imgTree { width: 260px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); padding: 6px; }
  #imgMain { flex: 1; min-width: 0; overflow-y: auto; padding: 10px; }
  .igrp > summary { cursor: pointer; padding: 4px 2px; font-size: 12px; color: var(--muted);
                    text-transform: uppercase; letter-spacing: .5px; }
  .ifile { padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 12px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ifile:hover { background: var(--hover, rgba(127,127,127,.12)); }
  .ifile.selected { background: var(--sel, rgba(90,140,220,.28)); }
  .ifile .k { font-size: 10px; color: var(--muted); margin-left: 4px; }
  #imgGrid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .icell { width: 132px; font-size: 10px; text-align: center; }
  .icell img { width: 128px; height: 128px; object-fit: contain; background:
               repeating-conic-gradient(#2a2a2a 0% 25%, #1e1e1e 0% 50%) 50% / 16px 16px;
               border: 1px solid var(--border); image-rendering: pixelated; cursor: zoom-in; }
  .icell .cap { color: var(--muted); line-height: 1.25; margin-top: 2px; word-break: break-all; }
  #imgHead { font-family: var(--mono); font-size: 12px; margin-bottom: 4px; }
  #imgZoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none;
             align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; }
  #imgZoom img { max-width: 92vw; max-height: 88vh; image-rendering: pixelated;
                 background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 24px 24px; }
  #imgZoom .zcap { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center;
                  color: #ddd; font-family: var(--mono); font-size: 12px; }
  @media (max-width: 760px) {
    #imgLayout { display: block; height: 100%; }
    #imgTree, #imgMain { display: none; width: 100% !important; height: 100%; border: none; }
    #imgTree.mobile-active, #imgMain.mobile-active { display: block; }
  }
</style>
<script src="i18n.js"></script>
</head>
<body>
<header>
  <h1>DQ7 Image Browser</h1>
  <nav>
    <a href="index.html" data-i18n="nav.script">スクリプト</a>
    <a href="fpt.html" data-i18n="nav.fpt">FPT</a>
    <a href="floor.html" data-i18n="nav.floor">フロア</a>
    <a href="encount.html" data-i18n="nav.encount">エンカウント</a>
    <a href="item.html" data-i18n="nav.item">アイテム</a>
    <a href="action.html" data-i18n="nav.action">特技・呪文</a>
    <a href="character.html" data-i18n="nav.character">キャラ</a>
    <a href="model.html" data-i18n="nav.model">モデル</a>
    <a href="images.html" class="current" data-i18n="nav.images">画像</a>
    <a href="save.html" data-i18n="nav.save">セーブ</a>
    <a href="keifa_probe.html" data-i18n="nav.keifa_probe">キーファ調査</a>
    <a href="jidx.html" data-i18n="nav.jidx">jidx</a>
  </nav>
  <span class="kv" id="status"></span>
</header>
<div id="mobileTabs">
  <button data-pane="imgTree" class="active" data-i18n="images.tabFile">ファイル</button>
  <button data-pane="imgMain" data-i18n="nav.images">画像</button>
</div>
<div id="imgLayout">
  <div class="pane mobile-active" id="imgTree">
    <input class="search-box" id="imgSearch" data-i18n-placeholder="images.searchPlaceholder" placeholder="ファイル名で絞り込み (例: p0003, world, icon)">
    <div id="imgTreeInner"><div class="empty" data-i18n="common.loading">読み込み中...</div></div>
  </div>
  <div class="pane" id="imgMain">
    <div id="imgHead" class="file-meta" data-i18n="images.selectFileHint">左のファイルを選択してください</div>
    <div id="imgGrid"></div>
  </div>
</div>
<div id="imgZoom"><img id="imgZoomImg" alt=""><div class="zcap" id="imgZoomCap"></div></div>
<script src="images.js"></script>
</body>
</html>
