<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQ7 Map 3D Viewer</title>
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<style>
  #mapLayout { display: flex; flex: 1; min-height: 0; }
  #mapFileList { width: 240px; flex-shrink: 0; overflow-y: auto; border-right: 1px solid var(--border); padding: 6px; }
  #mapViewport { flex: 1; min-width: 0; position: relative; background: #0d0f17; }
  #mapCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #mapInfo { width: 300px; flex-shrink: 0; overflow-y: auto; border-left: 1px solid var(--border);
             padding: 8px; font-family: var(--mono); font-size: 11.5px; line-height: 1.45;
             overflow-wrap: anywhere; }
  #mapInfo h3 { font-size: 12px; margin: 10px 0 4px; }
  /* wide tables (nodes: 6 columns) scroll inside their own box instead of
     pushing the pane wider than a ~375px phone screen */
  #mapInfo .table-wrap { overflow-x: auto; max-width: 100%; }
  #mapInfo table { border-collapse: collapse; width: 100%; }
  #mapInfo td { white-space: nowrap; }
  #mapInfo td, #mapInfo th { border-bottom: 1px solid var(--border); padding: 2px 4px; text-align: left;
                             vertical-align: top; font-weight: normal; }
  #mapInfo tr.node-row { cursor: pointer; }
  #mapInfo tr.node-row:hover { background: var(--hover, rgba(127,127,127,.12)); }
  #mapInfo tr.node-row.selected { background: var(--sel, rgba(90,140,220,.28)); }
  #mapStatus { position: absolute; left: 10px; top: 10px; right: 10px; background: rgba(0,0,0,.6);
               color: #cfe; font-size: 12px; padding: 4px 8px; border-radius: 4px; pointer-events: none;
               width: fit-content; max-width: calc(100% - 20px); }
  #mapToolbar { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex;
                flex-wrap: wrap; gap: 6px; }
  #mapToolbar button { font-size: 11.5px; padding: 3px 8px; }
  #mapToolbar button.active { background: #3a6ea5; color: #fff; border-color: #3a6ea5; }
  .mapfile-group > summary { cursor: pointer; padding: 4px 2px; font-size: 12px; color: var(--muted);
                             letter-spacing: .5px; }
  .mapfile-row { padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 12px;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mapfile-row:hover { background: var(--hover, rgba(127,127,127,.12)); }
  .mapfile-row.selected { background: var(--sel, rgba(90,140,220,.28)); }
  .mapfile-row .size { font-size: 10px; color: var(--muted); margin-left: 4px; }
  @media (max-width: 760px) {
    #mapLayout { display: block; height: 100%; }
    #mapFileList, #mapViewport, #mapInfo { display: none; width: 100% !important; height: 100%; border: none; }
    #mapFileList.mobile-active, #mapViewport.mobile-active, #mapInfo.mobile-active { display: block; }
  }
</style>
</head>
<body>
<header>
  <h1>DQ7 Map 3D Viewer</h1>
  <nav>
    <a href="index.html" data-i18n="nav.script">スクリプト</a>
    <a href="fpt.html" data-i18n="nav.fpt">FPT</a>
    <a href="floor.html" data-i18n="nav.floor">フロア</a>
    <a href="encount.html" data-i18n="nav.encount">エンカウント</a>
    <a href="item.html" data-i18n="nav.item">アイテム</a>
    <a href="action.html" data-i18n="nav.action">特技・呪文</a>
    <a href="character.html" data-i18n="nav.character">キャラ</a>
    <a href="model.html" data-i18n="nav.model">モデル</a>
    <a href="map3d.html" class="current" data-i18n="nav.map3d">マップ3D</a>
    <a href="images.html" data-i18n="nav.images">画像</a>
    <a href="save.html" data-i18n="nav.save">セーブ</a>
    <a href="keifa_probe.html" data-i18n="nav.keifa_probe">キーファ調査</a>
    <a href="jidx.html" data-i18n="nav.jidx">jidx</a>
  </nav>
  <span class="kv" id="status"></span>
</header>
<div id="mobileTabs">
  <button data-pane="mapFileList" class="active" data-i18n="map3d.tabFile">ファイル</button>
  <button data-pane="mapViewport" data-i18n="map3d.tab3d">3D</button>
  <button data-pane="mapInfo" data-i18n="map3d.tabInfo">情報</button>
</div>
<div id="mapLayout">
  <div class="pane mobile-active" id="mapFileList">
    <input class="search-box" id="mapSearch" data-i18n-placeholder="map3d.searchPlaceholder" placeholder="マップ名で絞り込み...">
    <div id="mapFileListInner"><div class="empty" data-i18n="common.loading">読み込み中...</div></div>
  </div>
  <div class="pane" id="mapViewport">
    <canvas id="mapCanvas"></canvas>
    <div id="mapStatus" data-i18n="map3d.threeLoading">Three.js 読み込み中...</div>
    <div id="mapToolbar">
      <button id="btnTex" class="active" data-i18n="map3d.btnTexture">テクスチャ</button>
      <button id="btnVColor" class="active" data-i18n="map3d.btnVertexColor">頂点カラー</button>
      <button id="btnWire" data-i18n="map3d.btnWireframe">ワイヤーフレーム</button>
      <button id="btnBoxes" data-i18n="map3d.btnBoxes">ノード枠</button>
      <button id="btnColl" data-i18n="map3d.btnColl">コリジョン</button>
      <button id="btnReset" data-i18n="map3d.btnReset">視点リセット</button>
    </div>
  </div>
  <div class="pane" id="mapInfo"><div class="empty" data-i18n="map3d.selectPrompt">マップを選択してください</div></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
} }
</script>
<script type="module" src="map3d.js"></script>
</body>
</html>
