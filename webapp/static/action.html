<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DQ7 Skill/Spell Data Viewer</title>
<link rel="stylesheet" href="style.css">
<style>
  #actionList { flex: 1; min-width: 0; }
  #actionList .ac-row { display: flex; gap: 6px; align-items: baseline;
    cursor: pointer; padding: 3px 4px; border-radius: 3px; font-size: 12.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #actionList .ac-row:hover { background: var(--hover, rgba(127,127,127,.12)); }
  #actionList .ac-row.selected { background: var(--sel, rgba(90,140,220,.28)); }
  #actionList .aid { color: var(--muted); min-width: 3.2em; text-align: right; font-family: var(--mono); }
  #actionList .amp { color: var(--muted); font-size: 11px; min-width: 3.2em; text-align: right; font-family: var(--mono); }
  #actionList .anm { overflow: hidden; text-overflow: ellipsis; }
  #actionList .anm.noname { color: var(--muted); font-style: italic; }
  .ac-sub { font-size: 12px; color: var(--muted); margin: 2px 0 6px; white-space: normal; }
  #detail table.kv2 { border-collapse: collapse; font-size: 12.5px; margin: 4px 0 10px; width: 100%; }
  #detail table.kv2 th, #detail table.kv2 td { border: 1px solid var(--border, #4444); padding: 2px 7px; text-align: left; }
  #detail table.kv2 th { color: var(--muted); font-weight: normal; white-space: nowrap; }
  #detail table.kv2 td.v { font-family: var(--mono); }
  #detail .sec { font-weight: bold; margin: 12px 0 3px; }
  #detail .mono { font-family: var(--mono); white-space: pre-wrap; word-break: break-all; }
  #detail .hint { color: var(--muted); }
  #typeTable { font-size: 12px; }
  #typeTable table { border-collapse: collapse; width: 100%; }
  #typeTable th, #typeTable td { border: 1px solid var(--border, #4444); padding: 2px 6px; font-family: var(--mono); white-space: nowrap; }
  #typeTable th { color: var(--muted); font-weight: normal; position: sticky; top: 0; background: var(--bg, #1e1e1e); }
</style>
<script src="i18n.js"></script>
</head>
<body>
<header>
  <h1>DQ7 Skill/Spell Data Viewer</h1>
  <nav>
    <a href="index.html" data-i18n="nav.script">スクリプト</a>
    <a href="fpt.html" data-i18n="nav.fpt">FPT</a>
    <a href="floor.html" data-i18n="nav.floor">フロア</a>
    <a href="encount.html" data-i18n="nav.encount">エンカウント</a>
    <a href="item.html" data-i18n="nav.item">アイテム</a>
    <a href="action.html" class="current" data-i18n="nav.action">特技・呪文</a>
    <a href="character.html" data-i18n="nav.character">キャラ</a>
    <a href="model.html" data-i18n="nav.model">モデル</a>
    <a href="map3d.html" data-i18n="nav.map3d">マップ3D</a>
    <a href="images.html" data-i18n="nav.images">画像</a>
    <a href="save.html" data-i18n="nav.save">セーブ</a>
    <a href="keifa_probe.html" data-i18n="nav.keifa_probe">キーファ調査</a>
    <a href="jidx.html" data-i18n="nav.jidx">jidx</a>
  </nav>
  <span class="kv" id="status"></span>
</header>
<div id="mobileTabs">
  <button data-pane="actionList" class="active" data-i18n="action.tabList">一覧</button>
  <button data-pane="detail" data-i18n="action.tabDetail">詳細</button>
  <button data-pane="typePane" data-i18n="action.tabType">action_type</button>
</div>
<div id="layout">
  <div class="pane mobile-active" id="actionList">
    <input class="search-box" id="actionSearch" data-i18n-placeholder="action.searchPlaceholder" placeholder="番号 / 名前 で絞り込み...">
    <div class="ac-sub" id="actionSub"></div>
    <div id="actionListInner"><div class="empty" data-i18n="common.loading">読み込み中...</div></div>
  </div>
  <div class="pane" id="detail">
    <div class="empty" data-i18n="action.selectHint">特技/呪文を選択すると全フィールドが表示されます</div>
  </div>
  <div class="pane" id="typePane">
    <div class="ac-sub" id="typeSub"></div>
    <div id="typeTable"><div class="empty" data-i18n="common.loading">読み込み中...</div></div>
  </div>
</div>
<script src="action.js"></script>
</body>
</html>
